name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you are
        trying to solve and your proposed solution.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is this for?
      options:
        - "@goopil/clusterkit"
        - "@goopil/clusterkit-prometheus"
        - "@goopil/clusterkit-sizing"
        - Not sure / monorepo-level
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What are you currently unable to do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I have searched the existing issues and discussions.
          required: true
