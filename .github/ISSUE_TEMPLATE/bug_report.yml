name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@goopil/clusterkit"
        - "@goopil/clusterkit-prometheus"
        - "@goopil/clusterkit-sizing"
        - Not sure / monorepo-level
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.12.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and version
      description: e.g. Ubuntu 24.04, macOS 15.2, Alpine 3.20
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: clusterkit-version
    attributes:
      label: clusterkit version
      description: Output of `pnpm list @goopil/clusterkit` (or the relevant plugin)
      placeholder: "1.0.3"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal code snippet or link to a reproduction repository.
        The smaller the repro, the faster we can help.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Truncate long logs.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I have searched the existing issues and discussions.
          required: true
