services:
  # -------------------------------------------------------------------------
  # test — run the full test suite on Linux (SO_REUSEPORT available)
  #
  # Usage:
  #   pnpm test:linux                # build image + run tests (from root)
  #   docker compose run --rm test   # same, manual
  #   docker compose build test      # pre-build only
  # -------------------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    environment:
      CI: "true"
      TURBO_DAEMON: "false"
      TURBO_TELEMETRY_DISABLED: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tty: false

  # -------------------------------------------------------------------------
  # e2e-health — chaos suite for the worker health & recovery subsystem
  # (Linux-only: /proc pid discovery, SO_REUSEPORT, SIGKILL drain escalation)
  #
  # Usage:
  #   docker compose run --build --rm e2e-health
  # -------------------------------------------------------------------------
  e2e-health:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    command: ["node", "packages/worker-manager/test/e2e/chaos.e2e.mjs"]
    environment:
      CI: "true"
      TURBO_DAEMON: "false"
      TURBO_TELEMETRY_DISABLED: "1"
      CKX_E2E: "1"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tty: false

  # -------------------------------------------------------------------------
  # examples — starts all example servers simultaneously
  #
  # App servers:
  #   http://localhost:3000  express
  #   http://localhost:3001  fastify
  #   http://localhost:3005  hono
  #   http://localhost:3006  koa
  #   http://localhost:3007  nestjs-express
  #   http://localhost:3008  nestjs-fastify
  #   http://localhost:3009  express-otlp (pushes to OTLP collector, no metrics port)
  #   http://localhost:3010  hot-reload
  #
  # Prometheus metrics (one per app):
  #   http://localhost:9090  express     http://localhost:9092  hono
  #   http://localhost:9091  fastify     http://localhost:9093  koa
  #
  # OTLP collector metrics (express-otlp):
  #   http://localhost:8889/metrics  (Prometheus scrape endpoint)
  #
  # Usage:
  #   pnpm examples:start                   # build image + start all servers
  #   docker compose up examples            # same, manual
  #   docker compose up examples --build    # force rebuild
  # -------------------------------------------------------------------------
  examples:
    build:
      context: .
      dockerfile: docker/Dockerfile.examples
    ports:
      # App servers
      - "3000:3000"
      - "3001:3001"
      - "3005:3005"
      - "3006:3006"
      - "3007:3007"
      - "3008:3008"
      - "3009:3009"
      - "3010:3010"
      # Metrics servers
      - "9090:9090"
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    environment:
      TURBO_DAEMON: "false"
      TURBO_TELEMETRY_DISABLED: "1"
      OTLP_ENDPOINT: "http://otel-collector:4318/v1/metrics"
    depends_on:
      - otel-collector
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tty: false

  # -------------------------------------------------------------------------
  # otel-collector — receives OTLP metrics from the express-otlp example
  #
  # Receives OTLP/HTTP on :4318, exposes a Prometheus scrape endpoint on :8889
  # so you can verify the metrics are flowing.
  #
  # Usage:
  #   docker compose up otel-collector examples   # start collector + all apps
  #   curl localhost:8889/metrics                 # check received metrics
  # -------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP/HTTP receiver
      - "8889:8889"   # Prometheus exporter (scrape to verify)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
