sonar.projectKey=Goopil_clusterkit
sonar.organization=goopil
sonar.projectName=clusterkit
sonar.sourceEncoding=UTF-8

# Each package is a SonarQube module — LCOV paths resolve relative to each module's projectBaseDir
sonar.modules=worker-manager,plugin-prometheus,plugin-container-sizing,plugin-otlp-meter,plugin-signal-restart,plugin-file-watcher

# Global exclusions (applied per-module, relative to each module's baseDir)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/*.config.ts
sonar.testExclusions=**/fixtures/**,**/helpers/**

# --- worker-manager ---
worker-manager.sonar.projectBaseDir=packages/worker-manager
worker-manager.sonar.sources=src
worker-manager.sonar.tests=test
worker-manager.sonar.typescript.tsconfigPath=tsconfig.json
worker-manager.sonar.javascript.lcov.reportPaths=coverage/lcov.info

